# yaml-language-server: $schema=https://gitlab.wikimedia.org/repos/cloud/toolforge/components-api/-/raw/main/openapi/tool-config-schema.json
# toolforge build and run config, from gs-steward-stats
# load once with: toolforge components config create toolforge.yaml
config_version: v1beta1
source_url: https://raw.githubusercontent.com/sarojoffl/global-mass-rollback/main/toolforge.yaml
components:
  web:
    component_type: continuous
    build:
      repository: https://github.com/sarojoffl/global-mass-rollback
      ref: main
    run:
      command: web
      port: 8000
      publish: /
      health_check_http: /healthz
      replicas: 1
      cpu: "0.5"
      memory: 512Mi
      # tool home keeps stats.json across rebuilds
      mount: all
